<script>
function validateForm() {
  const phoneNumber = document.forms[0].myPhone.value;
  const regex = /^\d{3}-\d{3}-\d{4}$/;

  if (regex.test(phoneNumber)) {
    return true;
  } else {
    alert("Invalid phone number: include a dash after the area code and a dash after the first 3 digits of the phone number.");
    return false;
  }
}
</script>

</head>
<body>

<h2>Reservations at Pacific Trails</h2>

<h3>Contact Us</h3>
<p>Required fields are marked with an asterisk *</p>

<form method="post" action="https://webdevbasics.net/scripts/pacific.php" onsubmit="return validateForm();">

<input type="text" id="myFName" name="myFName" required>

<label for="myLName">*Last Name:</label>
<input type="text" id="myLName" name="myLName" required>

<label for="myEmail">*Email:</label>

<input type="date" id="myArrival" name="myArrival">

<label for="myNights">Nights:</label>
<input type="number" id="myNights" name="myNights" min="1" max="14">

<label for="myComments">Comments:</label>
<textarea id="myComments" name="myComments" rows="2" cols="30"></textarea>

<input type="submit" value="Submit">
</form>

</main>
